title: THINK
description: Notes on thinking, learning, science, technology, and human flourishing.
url: "https://mateusrn.github.io"
baseurl: ""

markdown: kramdown
permalink: /posts/:title/
timezone: America/Sao_Paulo

kramdown:
  math_engine: mathjax

exclude:
  - PRIVATE_WORKFLOW.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - README.md
  - _obsidian_source/
  - vendor/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
